# Server block untuk Nginx HOST (bukan container). Salin ke VPS, misalnya:
#   sudo cp infra/nginx/host/julian-marcell.com.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/julian-marcell.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Hanya domain ini yang terdampak; server block project lain tidak diubah.
#
# File sertifikat yang perlu ada di VPS:
#   /etc/ssl/cloudflare/toolland.pem                 (Origin Certificate)
#   /etc/ssl/cloudflare/toolland.key                 (private key Origin Certificate)
#   /etc/ssl/cloudflare/origin-pull-ca.pem           (CA Authenticated Origin Pulls)
#     https://developers.cloudflare.com/ssl/static/authenticated_origin_pull_ca.pem

# File ini di-include pada konteks http, jadi log_format boleh di sini.
# Log tanpa IP dan tanpa query string; rotasi harian, disimpan 7 hari (infra/logrotate/toolland).
map $request_uri $toolland_log_path {
    ~^(?<path>[^?]*) $path;
}
log_format toolland_privacy '$time_iso8601 $host "$request_method $toolland_log_path $server_protocol" '
                            '$status $body_bytes_sent $request_time';

server {
    listen 80;
    listen [::]:80;
    server_name julian-marcell.com www.julian-marcell.com;
    return 301 https://julian-marcell.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name julian-marcell.com www.julian-marcell.com;

    ssl_certificate     /etc/ssl/cloudflare/toolland.pem;
    ssl_certificate_key /etc/ssl/cloudflare/toolland.key;

    # Authenticated Origin Pulls: hanya terima koneksi bersertifikat Cloudflare.
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;

    access_log /var/log/nginx/julian-marcell.com.access.log toolland_privacy;
    error_log  /var/log/nginx/julian-marcell.com.error.log warn;

    # IP asli pengguna dari Cloudflare (untuk rate limit), daftar dari
    # https://www.cloudflare.com/ips/ (dicek 2 Nov 2026; perbarui berkala).
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # www -> domain utama
    if ($host = www.julian-marcell.com) {
        return 301 https://julian-marcell.com$request_uri;
    }

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # $remote_addr = IP asli dari CF-Connecting-IP. Header IP buatan pengguna ditimpa/dibuang
    # supaya rate limit API tidak bisa diakali dengan IP palsu.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto https;

    # API: batas 16m (Axum menegakkan 15 MB). Upload/download di-stream langsung,
    # dan buffer dibuat cukup besar di RAM, sehingga file tidak pernah ditulis
    # ke file sementara Nginx di disk.
    location /api/tools/ {
        client_max_body_size 16m;
        client_body_buffer_size 16m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_pass http://127.0.0.1:8082;
    }

    # Halaman statis. Tidak menerima upload.
    location / {
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8081;
    }
}
