# Header keamanan untuk semua respons. Di-include ulang di setiap location,
# karena add_header di dalam location menimpa add_header milik server.
# CSP utama (script-src/style-src dengan hash) ada di <meta> hasil build Astro;
# frame-ancestors hanya berlaku lewat header, jadi ditambahkan di sini.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# $cam_policy/$mic_policy dari web.conf: "(self)" hanya di halaman yang butuh kamera/mikrofon
# (rapat online; editor video dan rekam layar untuk mikrofon), selain itu "()".
add_header Permissions-Policy "camera=$cam_policy, microphone=$mic_policy, geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
