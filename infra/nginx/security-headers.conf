# Header keamanan untuk semua respons. Di-include ulang di setiap location,
# karena add_header di dalam location menimpa add_header milik server.
# CSP utama (script-src/style-src dengan hash) ada di <meta> hasil build Astro;
# frame-ancestors hanya berlaku lewat header, jadi ditambahkan di sini.
add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# $mic_policy dari web.conf: "(self)" hanya di halaman editor video, selain itu "()".
add_header Permissions-Policy "camera=(), microphone=$mic_policy, geolocation=(), interest-cohort=()" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
