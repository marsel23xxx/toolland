# Nginx di dalam container web: menyajikan hasil build Astro.
# Header dan cache diatur di sini agar konfigurasinya tersimpan di repo.

# Path asli dari request, tanpa query string. Dipakai untuk pencocokan halaman media.
# ($uri tidak dipakai karena try_files mengubahnya menjadi .../nama.html)
map $request_uri $req_path {
    ~^(?<path>[^?]*) $path;
}


# Halaman yang butuh SharedArrayBuffer untuk WASM multi-thread:
# tools media (ffmpeg.wasm) dan hapus background (ONNX Runtime).
# Tambahkan slug versi Indonesia dan Inggris di sini.
map $req_path $media_page {
    default 0;
    ~^/tools/(video-ke-gif|kompres-video|ekstrak-audio|hapus-background|edit-video)$ 1;
    ~^/en/tools/(video-to-gif|compress-video|extract-audio|remove-background|video-editor)$ 1;
}
map $media_page $coop {
    1 "same-origin";
    default "";
}
map $media_page $coep {
    1 "require-corp";
    default "";
}

# Mikrofon hanya untuk rekam narasi di editor video; halaman lain tetap memblokirnya.
map $req_path $mic_policy {
    default "()";
    ~^/tools/edit-video$ "(self)";
    ~^/en/tools/video-editor$ "(self)";
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /srv/web/current;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    # Log akses dicatat sekali saja oleh Nginx host (rotasi 7 hari, lihat infra/logrotate).
    # Log Docker dirotasi per ukuran, bukan per hari, jadi container tidak mencatat akses.
    access_log off;
    error_log /dev/stderr warn;
    # Jangan catat "file tidak ditemukan" (baris error_log memuat IP klien).
    log_not_found off;

    # Cloudflare mengompres ke pengguna (Brotli); gzip menghemat jalur origin -> Cloudflare.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/wasm
               image/svg+xml application/xml text/plain application/manifest+json;

    # Pastikan .wasm selalu application/wasm agar bisa di-stream-compile.
    include /etc/nginx/mime.types;
    types {
        application/wasm wasm;
        text/javascript mjs;
        application/manifest+json webmanifest;
    }

    error_page 404 /404.html;

    # Satu URL kanonik tanpa garis miring akhir: /tools/x/ -> /tools/x
    rewrite ^(.+)/$ $1 permanent;

    # Aset dengan hash di nama file: cache 1 tahun.
    # COEP juga pada aset: worker yang dibuat di halaman cross-origin isolated
    # (ffmpeg.wasm, hapus background) diblokir browser bila script-nya tanpa COEP.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    # Aset vendor (model AI, wasm, ffmpeg core) dengan versi di path: cache 1 tahun.
    location /vendor/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        try_files $uri =404;
    }

    # File publik tanpa hash (favicon, robots, sitemap): cache pendek.
    location ~* \.(?:ico|svg|png|webp|avif|txt|xml|webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # HTML: boleh di-cache tapi selalu direvalidasi.
    # URL tanpa garis miring akhir: /tools/jpg-ke-webp -> tools/jpg-ke-webp.html
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header Cross-Origin-Opener-Policy $coop always;
        add_header Cross-Origin-Embedder-Policy $coep always;
        try_files $uri $uri.html $uri/index.html =404;
    }

    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}
