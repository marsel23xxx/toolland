[package]
name = "toolland-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
bytes = "1.12.1"
infer = "0.22.0"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false, features = ["http-listener"] }
mimalloc = "0.1.52"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "multipart", "json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "io-util", "time", "fs", "process", "sync"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower_governor = "0.8.0"
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
x509-parser = "0.18.1"

[dev-dependencies]
futures-util = "0.3.31"
http-body-util = "0.1.5"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
