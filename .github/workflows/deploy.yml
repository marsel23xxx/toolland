name: Deploy

# Jalan otomatis setelah CI hijau di main. Bisa juga dijalankan manual dari tab Actions.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/toolland-api
  CONVERTER_IMAGE: ghcr.io/${{ github.repository_owner }}/toolland-converter
  REMOTE: /srv/toolland

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      # ---------- Backend: image Docker ke GitHub Container Registry ----------
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.SHA }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/converter/Dockerfile
          push: true
          tags: |
            ${{ env.CONVERTER_IMAGE }}:${{ env.SHA }}
            ${{ env.CONVERTER_IMAGE }}:latest
          cache-from: type=gha,scope=converter
          cache-to: type=gha,mode=max,scope=converter

      # ---------- Frontend: build statis ----------
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: ~/.cache/toolland-vendor
          key: vendor-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: vendor-
      - run: pnpm build

      # ---------- Kirim ke VPS ----------
      - name: Siapkan SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # Port SSH VPS (secret DEPLOY_PORT, bawaan 22); dipakai ssh dan rsync.
          printf 'Host %s\n  Port %s\n' "${{ secrets.DEPLOY_HOST }}" "${{ secrets.DEPLOY_PORT || '22' }}" > ~/.ssh/config
          echo "TARGET=${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" >> "$GITHUB_ENV"

      - name: Salin konfigurasi infra
        run: rsync -az --delete --exclude 'nginx/host/' infra/ "$TARGET:$REMOTE/infra/"

      # File yang isinya sama dengan rilis aktif (misalnya model AI) di-hardlink, tidak dikirim ulang.
      # Waktu file sengaja tidak disalin (-rlpD, bukan -a): rsync hanya membuat hardlink bila waktu sama.
      - name: Upload rilis frontend ke folder baru
        run: rsync -rlpDz --delete --checksum --link-dest="$REMOTE/web/current/" apps/web/dist/ "$TARGET:$REMOTE/web/releases/$SHA/"

      - name: Aktifkan rilis frontend (pindah symlink)
        run: ssh "$TARGET" "$REMOTE/infra/scripts/activate-release.sh $SHA $REMOTE/web"

      - name: Update backend
        run: |
          IMAGES="API_IMAGE=$API_IMAGE:$SHA CONVERTER_IMAGE=$CONVERTER_IMAGE:$SHA"
          ssh "$TARGET" "cd $REMOTE/infra && $IMAGES docker compose --env-file ../.env pull api converter gotenberg && $IMAGES docker compose --env-file ../.env up -d --remove-orphans"

      - name: Cek health
        run: |
          for _ in $(seq 1 20); do
            if ssh "$TARGET" "curl -fsS http://127.0.0.1:8082/api/tools/v1/health && curl -fsS -o /dev/null http://127.0.0.1:8081/"; then exit 0; fi
            sleep 3
          done
          echo "Health check gagal. Rollback frontend: ssh ke VPS lalu jalankan $REMOTE/infra/scripts/rollback.sh" >&2
          exit 1
